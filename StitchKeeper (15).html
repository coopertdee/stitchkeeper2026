<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StitchKeeper</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --slate:#3d5a73; --horizon:#5b7a94; --twilight:#2a3f52;
  --ivory:#f7f4ef; --oat:#e8e0d5; --burlap:#c7b9a8;
  --jute:#a08d7a; --timber:#7d6b5a; --fog:#f5f5f4;
  --pebble:#78716c; --charcoal:#44403c;
  --bg:var(--ivory); --surface:#fff; --border:#d8cfc4;
  --text:var(--charcoal); --text2:var(--timber); --text3:var(--pebble);
  --accent:var(--slate); --accent2:var(--horizon); --accent3:var(--twilight);
  --sand:var(--oat); --warm1:#ede8e0; --warm2:#d8d0c4;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Inter',system-ui,sans-serif;
  --radius:10px; --radius-lg:14px;
  --shadow:0 1px 3px rgba(0,0,0,0.06),0 4px 12px rgba(0,0,0,0.06);
  --shadow-lg:0 4px 16px rgba(0,0,0,0.1),0 20px 48px rgba(0,0,0,0.12);
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--burlap);border-radius:99px;}

/* ── HEADER ── */
.app-header{
  background:var(--twilight);
  padding:0 40px;
  color:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  border-bottom:1px solid rgba(255,255,255,0.08);
  min-height:64px;
}
.app-header-left{display:flex;align-items:center;gap:16px;}
.app-logo-mark{
  width:36px;height:36px;
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.app-title{font-family:var(--serif);font-size:22px;font-weight:600;color:#fff;letter-spacing:0.04em;}
.app-subtitle{font-size:11px;color:rgba(255,255,255,0.5);letter-spacing:0.06em;text-transform:uppercase;margin-top:1px;}
.header-stats{display:flex;gap:0;flex-wrap:wrap;}
.hstat{
  text-align:center;
  padding:0 20px;
  border-left:1px solid rgba(255,255,255,0.1);
}
.hstat:first-child{border-left:none;}
.hstat-num{font-family:var(--serif);font-size:22px;font-weight:600;color:#fff;line-height:1.2;}
.hstat-lbl{font-size:10px;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:0.08em;margin-top:2px;}

/* ── NAV ── */
.nav{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:0 40px;
  display:flex;
  gap:0;
  overflow-x:auto;
}
.nav-btn{
  padding:0 18px;
  height:48px;
  border:none;
  background:none;
  color:var(--text3);
  font-family:var(--sans);
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  border-bottom:2px solid transparent;
  white-space:nowrap;
  transition:all 0.15s;
  display:flex;align-items:center;gap:8px;
  letter-spacing:0.01em;
}
.nav-btn:hover{color:var(--text);background:var(--ivory);}
.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
.nav-icon{width:16px;height:16px;opacity:0.6;flex-shrink:0;}
.nav-btn.active .nav-icon{opacity:1;}

/* ── MAIN ── */
.main{max-width:1360px;margin:0 auto;padding:32px 40px 80px;}

/* ── PAGE HEADER ── */
.page-hdr{display:flex;align-items:flex-end;gap:16px;margin-bottom:28px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--border);}
.page-hdr-title{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--text);line-height:1;}
.page-hdr-sub{font-size:13px;color:var(--text3);margin-top:4px;}
.page-hdr-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow);margin-bottom:16px;}
.card-title{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--text);margin-bottom:4px;line-height:1.3;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
.card-meta{font-size:12px;color:var(--text3);display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;}
.card-meta-item{display:flex;gap:4px;}
.card-meta-label{color:var(--text3);}
.card-meta-value{color:var(--text2);}

/* ── FORMS ── */
.field{margin-bottom:16px;}
.field label,.field-label{display:block;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.09em;margin-bottom:6px;font-weight:600;}
.inp{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--sans);font-size:14px;color:var(--text);background:var(--surface);outline:none;transition:border-color 0.15s;}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(61,90,115,0.08);}
textarea.inp{min-height:80px;resize:vertical;line-height:1.5;}
select.inp{cursor:pointer;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;}
.span2{grid-column:1/-1;}

/* ── BUTTONS ── */
.btn{
  font-family:var(--sans);font-weight:600;
  padding:8px 18px;border-radius:var(--radius);
  cursor:pointer;border:none;
  display:inline-flex;align-items:center;gap:7px;
  font-size:13px;transition:all 0.15s;
  letter-spacing:0.01em;white-space:nowrap;
}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent3);}
.btn-secondary{background:transparent;color:var(--text2);border:1px solid var(--border);}
.btn-secondary:hover{background:var(--ivory);border-color:var(--jute);}
.btn-ghost{background:transparent;color:var(--text3);border:1px solid var(--border);}
.btn-ghost:hover{background:var(--ivory);}
.btn-danger{background:#b91c1c;color:#fff;}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:7px;}
.btn-cart{background:var(--jute);color:#fff;font-family:var(--sans);font-weight:600;padding:5px 10px;border-radius:7px;cursor:pointer;border:none;font-size:12px;display:inline-flex;align-items:center;gap:4px;transition:all 0.15s;}
.btn-cart:hover{background:var(--timber);}
.btn-icon{background:none;border:none;cursor:pointer;padding:4px;color:var(--text3);display:inline-flex;border-radius:6px;transition:all 0.15s;}
.btn-icon:hover{color:var(--accent);background:var(--ivory);}
.btn-icon.del:hover{color:#b91c1c;background:#fef2f2;}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;font-family:var(--sans);letter-spacing:0.02em;}

/* ── TABLES ── */
.table-wrap{border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow);}
.tbl{width:100%;border-collapse:collapse;min-width:500px;}
.tbl th{padding:10px 12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:var(--text3);background:var(--ivory);white-space:nowrap;border-bottom:1px solid var(--border);text-align:left;border-right:1px solid var(--border);}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);vertical-align:middle;font-size:13px;color:var(--text);}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:nth-child(even) td{background:var(--fog);}
.tbl tr:hover td{background:var(--ivory)!important;}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(20,16,12,0.55);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--surface);border-radius:var(--radius-lg);padding:0;width:100%;max-width:680px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg);border:1px solid var(--border);display:flex;flex-direction:column;}
.modal.wide{max-width:840px;}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;padding:24px 28px 18px;border-bottom:1px solid var(--border);}
.modal-title{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--text);line-height:1.2;}
.modal-body{padding:24px 28px;overflow-x:hidden;flex:1;}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;padding:16px 28px;border-top:1px solid var(--border);background:var(--ivory);flex-shrink:0;margin:24px -28px -24px;border-radius:0 0 var(--radius-lg) var(--radius-lg);}
.btn-modal-close{background:none;border:none;cursor:pointer;color:var(--text3);display:flex;padding:6px;border-radius:7px;transition:all 0.15s;}
.btn-modal-close:hover{background:var(--ivory);color:var(--text);}

/* ── PROGRESS ── */
.progress-bar{height:6px;background:var(--oat);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--horizon),var(--slate));border-radius:99px;transition:width 0.4s cubic-bezier(.4,0,.2,1);}

/* ── STATUS BADGES ── */
.s-inprogress{background:#e8eef4;color:#2a3f52;border:1px solid rgba(42,63,82,0.2);}
.s-kitted{background:#ede8e0;color:#5a4830;border:1px solid rgba(90,72,48,0.2);}
.s-needtoffo{background:#e4ece8;color:#2e5040;border:1px solid rgba(46,80,64,0.2);}
.s-completed{background:#e8f0f4;color:#3d5a73;border:1px solid rgba(61,90,115,0.2);}
.s-onhold{background:#ede4d8;color:#6b4f38;border:1px solid rgba(107,79,56,0.2);}
.s-frogged{background:#e8e4ee;color:#4a3a60;border:1px solid rgba(74,58,96,0.2);}

/* ── TILE GRID ── */
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
.tile{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  overflow:hidden;
  cursor:pointer;
  transition:all 0.2s;
  box-shadow:var(--shadow);
}
.tile:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,0.1),0 12px 32px rgba(0,0,0,0.08);border-color:var(--jute);}
.tile-selected{border-color:var(--accent)!important;box-shadow:0 0 0 3px rgba(61,90,115,0.1)!important;}
.tile-accent-bar{height:4px;}
.tile-body{padding:16px 18px;}
.tile-name{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--text);margin-bottom:3px;line-height:1.3;}
.tile-sub{font-size:12px;color:var(--text3);margin-bottom:10px;}
.tile-footer{display:flex;align-items:center;justify-content:space-between;}
.tile-count{font-size:12px;font-weight:600;color:var(--accent);background:rgba(61,90,115,0.08);padding:3px 10px;border-radius:99px;}
.tile-cta{font-size:12px;color:var(--text3);}
.tile-actions{display:flex;gap:2px;margin-top:4px;}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:56px 20px;color:var(--text3);}
.empty-icon{margin-bottom:16px;opacity:0.3;}
.empty-title{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--text2);margin-bottom:6px;}
.empty-sub{font-size:13px;color:var(--text3);max-width:320px;margin:0 auto;}

/* ── SEARCH ── */
.search-wrap{position:relative;}
.search-wrap input{padding-left:36px;}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;}

/* ── DIVIDER ── */
.divider{height:1px;background:var(--border);margin:20px 0;}

/* ── CONVERSION TABLE ── */
.conv-table{width:100%;border-collapse:collapse;font-size:13px;}
.conv-table th{background:var(--twilight);color:rgba(255,255,255,0.85);padding:10px 14px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;}
.conv-table td{padding:9px 14px;border-bottom:1px solid var(--border);color:var(--text);}
.conv-table tr:nth-child(even) td{background:var(--ivory);}
.conv-table tr:hover td{background:var(--oat);}

/* ── CALCULATOR ── */
.calc-step{margin-bottom:24px;}
.calc-step-title{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.step-num{width:26px;height:26px;background:var(--accent);color:#fff;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;font-family:var(--sans);}
.calc-result{background:var(--twilight);border-radius:var(--radius-lg);padding:24px;margin-top:24px;color:#fff;}
.result-label{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:rgba(255,255,255,0.5);margin-bottom:4px;}
.result-big{font-family:var(--serif);font-size:32px;font-weight:600;color:#fff;line-height:1.1;}
.result-sub{font-size:12px;color:rgba(255,255,255,0.55);margin-top:3px;}
.result-card{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:var(--radius);padding:16px;}
.type-opt{flex:1;min-width:160px;padding:14px 16px;border-radius:var(--radius);cursor:pointer;transition:all 0.15s;border:1.5px solid var(--border);background:var(--surface);}
.type-opt:hover{border-color:var(--jute);background:var(--ivory);}
.type-opt.sel{border-color:var(--accent);background:rgba(61,90,115,0.06);}
.type-opt-title{font-weight:600;font-size:14px;color:var(--text);margin-bottom:2px;}
.type-opt-sub{font-size:12px;color:var(--text3);}

/* ── SECTION LABEL ── */
.section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.09em;color:var(--text3);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);}

/* ── INLINE INPUT ── */
.inline-inp{padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-family:var(--sans);font-size:13px;color:var(--text);background:var(--surface);width:100%;}

@media(max-width:768px){.main{padding:20px;}.app-header,.nav{padding-left:20px;padding-right:20px;}.form-grid{grid-template-columns:1fr;}.tile-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));}}

/* ── INVENTORY PANELS ── */
.inv-modal-overlay{position:fixed;inset:0;background:rgba(20,16,12,0.55);backdrop-filter:blur(4px);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px;}
.inv-modal{background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:960px;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);border:1px solid var(--border);overflow:hidden;}
.inv-modal-hdr{padding:22px 28px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-shrink:0;}
.inv-modal-body{flex:1;overflow-y:auto;padding:24px 28px;}
</style>
</head>
<body>

<div id="app">
  <header class="app-header">
    <div class="app-header-left">
      <div class="app-logo-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.5"><path d="M12 2L8 22M12 2L16 22M12 2C12 2 9 6 9 10s3 4 3 4 3-1 3-4-3-8-3-8z"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
      </div>
      <div>
        <div class="app-title">StitchKeeper</div>
        <div class="app-subtitle">Cross-stitch companion</div>
      </div>
    </div>
    <div class="header-stats">
      <div class="hstat"><div class="hstat-num" id="hs-projects">0</div><div class="hstat-lbl">Projects</div></div>
      <div class="hstat"><div class="hstat-num" id="hs-inprogress">0</div><div class="hstat-lbl">In Progress</div></div>
      <div class="hstat"><div class="hstat-num" id="hs-completed">0</div><div class="hstat-lbl">Completed</div></div>
      <div class="hstat"><div class="hstat-num" id="hs-wishlist">0</div><div class="hstat-lbl">Wish List</div></div>
    </div>
  </header>

  <nav class="nav" id="mainNav">
    <button class="nav-btn active" data-tab="projects"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg> Projects</button>
    <button class="nav-btn" data-tab="charts"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg> Charts</button>
    <button class="nav-btn" data-tab="fabric"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18"/></svg> Fabric</button>
    <button class="nav-btn" data-tab="floss"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 3c0 0-4 4-4 9s4 9 4 9"/><path d="M3 12h18"/></svg> Floss</button>
    <button class="nav-btn" data-tab="notions"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> Notions</button>
    <button class="nav-btn" data-tab="wishlist"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg> Wish List</button>
    <button class="nav-btn" data-tab="shopping"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg> Shopping</button>
    <button class="nav-btn" data-tab="conversion"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg> Conversions</button>
    <button class="nav-btn" data-tab="calculator"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="10" y2="10"/><line x1="14" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="10" y2="14"/><line x1="14" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="10" y2="18"/><line x1="14" y1="18" x2="16" y2="18"/></svg> Calculator</button>
  </nav>

  <main class="main" id="tabContent"></main>
</div>

<!-- FLOSS INVENTORY PANEL -->
<div id="flossInvOverlay" class="inv-modal-overlay" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="inv-modal">
    <div class="inv-modal-hdr">
      <div style="width:4px;height:40px;border-radius:99px;background:var(--slate);flex-shrink:0"></div>
      <div style="flex:1">
        <div style="font-family:var(--serif);font-size:22px;font-weight:600;color:var(--text)" id="flossInvTitle"></div>
        <div style="font-size:13px;color:var(--text3);margin-top:2px" id="flossInvSub"></div>
      </div>
      <button class="btn-modal-close" onclick="document.getElementById('flossInvOverlay').style.display='none'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="inv-modal-body" id="flossInvBody"></div>

let currentTab = 'projects';
document.getElementById('mainNav').addEventListener('click', e => {
  const btn = e.target.closest('[data-tab]');
  if (!btn) return;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentTab = btn.dataset.tab;
  renderTab();
});

function renderTab() {
  const el = document.getElementById('tabContent');
  const renders = {projects:renderProjects,charts:renderCharts,fabric:renderFabric,floss:renderFloss,notions:renderNotions,wishlist:renderWishlist,shopping:renderShopping,conversion:renderConversion,calculator:renderCalculator};
  if (renders[currentTab]) renders[currentTab]();
  updateStats();
}

function updateStats() {
  document.getElementById('hs-projects').textContent = (data.projects||[]).length;
  document.getElementById('hs-inprogress').textContent = (data.projects||[]).filter(p=>p.status==='In Progress').length;
  document.getElementById('hs-completed').textContent = (data.projects||[]).filter(p=>p.status==='Completed').length;
  document.getElementById('hs-wishlist').textContent = (data.wishlist||[]).length;
}

function openModal(title, bodyHtml, wide=false) {
  document.getElementById('modalTitle').textContent = title;

  document.getElementById('modalOverlay').style.display = 'flex';
  document.getElementById('modalOverlay').scrollTop = 0;
}
function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').style.display = 'none';
}

function renderProjects() {
  const projects = data.projects || [];
  const el = document.getElementById('tabContent');
  const q = (window._projectSearch||'').toLowerCase();

  let html = `<div style="display:flex;align-items:center;gap:14px;margin-bottom:24px;flex-wrap:wrap">
    <div>
      <h2 style="font-family:var(--serif);font-size:26px;color:var(--text);margin:0">My Projects</h2>
      <div style="font-size:13px;color:var(--text3);margin-top:2px">${projects.length} project${projects.length!==1?'s':''}</div>
    </div>
    <div style="flex:1;min-width:200px;position:relative;max-width:400px;margin-left:auto">
      <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3)">${ICONS.search}</span>
      <input class="inp" style="padding-left:36px" placeholder="Search projects..." value="${esc(q)}" oninput="window._projectSearch=this.value;renderProjects()"/>
    </div>
    <button class="btn btn-primary" onclick="openProjectForm()">+ New Project</button>
  </div>`;

  if (q) {
    // Search results flat view
    const filtered = projects.filter(p => [p.title,p.pattern,p.designer,p.fabric,p.flossColors,p.status].some(v=>v&&v.toLowerCase().includes(q)));
    html += `<div style="font-size:13px;color:var(--text3);margin-bottom:14px">${filtered.length} result${filtered.length!==1?'s':''} for "${esc(q)}"</div>`;
    html += filtered.length
      ? `<div class="card-grid">` + filtered.map(p => projectCardHtml(p)).join('') + `</div>`
      : `<div class="empty"><div class="empty-icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div><div class="empty-title">No projects match</div></div>`;
  } else {
    // Status tiles — click opens modal
    html += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px">`;
    STATUS_LIST.forEach(status => {
      const meta = STATUS_META[status];
      const count = projects.filter(p=>p.status===status).length;
      html += `<div class="tile" onclick="openStatusModal('${status}')">
        <div class="tile-accent-bar" style="background:${meta.badge}"></div>
        <div class="tile-body">
          <div class="tile-name">${status}</div>
          <div class="tile-sub">${meta.desc}</div>
          <div class="tile-footer">
            <span class="tile-count">${count} project${count!==1?'s':''}</span>
            <span class="tile-cta">View →</span>
          </div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  el.innerHTML = html;
}

function openStatusModal(status) {
  const meta = STATUS_META[status];
  const projects = (data.projects||[]).filter(p=>p.status===status);

  const renderBody = () => {
    const bodyEl = document.getElementById('status-modal-body');
    if (!bodyEl) return;
    const currentProjects = (data.projects||[]).filter(p=>p.status===status);
    const countEl = document.getElementById('status-modal-count');
    if (countEl) countEl.textContent = currentProjects.length + ' project' + (currentProjects.length!==1?'s':'');
    if (!currentProjects.length) {
      bodyEl.innerHTML = `<div class="empty" style="padding:40px"><div class="empty-icon">${meta.emoji}</div><div class="empty-title">No ${status} projects yet</div><div class="empty-sub">Click + Add Project to add one!</div></div>`;
    } else {
      bodyEl.innerHTML = `<div class="card-grid">` + currentProjects.map(p => projectCardHtml(p, true)).join('') + `</div>`;
    }
  };

  openModal(status, `
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--border)">
      <div style="width:4px;height:44px;background:${meta.badge};border-radius:99px;flex-shrink:0"></div>
      <div>
        <div style="font-family:var(--serif);font-size:22px;font-weight:600;color:var(--text);line-height:1.2">${status}</div>
        <div style="font-size:13px;color:var(--text3);margin-top:2px">${meta.desc}</div>
      </div>
      <span id="status-modal-count" style="background:${meta.badge}22;color:${meta.badge};border:1px solid ${meta.badge}44;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700">${projects.length} project${projects.length!==1?'s':''}</span>
      <button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="openProjectForm(null,'${status}')">+ Add Project</button>
    </div>
    <div id="status-modal-body"></div>
  `, true);

  renderBody();
  window._statusModalRefresh = renderBody;
}

  const meta = STATUS_META[p.status] || TILE_PALETTE[0];
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
      <div style="font-family:var(--serif);font-size:15px;color:var(--text);flex:1;padding-right:8px">${esc(p.title||'Untitled')}${p.isGift?` <span title="Gift for ${esc(p.giftFor||'someone')}" style="font-size:12px">🎁</span>`:''}</div>
      <div style="display:flex;gap:4px;flex-shrink:0">
        <button class="btn btn-secondary btn-sm" onclick="openProgressModal('${p.id}')" title="Track Progress" style="font-size:11px;padding:3px 8px">${ICONS.progress} Progress</button>
        <button class="btn-icon" onclick="openProjectForm('${p.id}')" title="Edit">${ICONS.edit}</button>
        <button class="btn-icon del" onclick="deleteProject('${p.id}')" title="Delete">${ICONS.trash}</button>
      </div>
    </div>
    <div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em">Progress</span>
        <span style="font-size:13px;font-weight:700;color:var(--accent)">${pct}%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      ${sessions>0?`<div style="font-size:11px;color:var(--text3);margin-top:4px">${sessions} session${sessions!==1?'s':''} · ${totalHrs.toFixed(1)}h total</div>`:''}
    </div>
    <div style="font-size:12px;color:var(--text2);display:grid;grid-template-columns:1fr 1fr;gap:3px 10px">
      ${p.pattern?`<div><span style="color:var(--text3)">Pattern: </span>${esc(p.pattern)}</div>`:''}
      ${p.designer?`<div><span style="color:var(--text3)">Designer: </span>${esc(p.designer)}</div>`:''}
      ${p.fabric?`<div><span style="color:var(--text3)">Fabric: </span>${esc(p.fabric)}</div>`:''}
      ${p.fabricCount?`<div><span style="color:var(--text3)">Count: </span>${esc(p.fabricCount)}</div>`:''}
      ${p.dateStarted?`<div><span style="color:var(--text3)">Started: </span>${p.dateStarted}</div>`:''}
      ${p.dateEnded?`<div><span style="color:var(--text3)">Finished: </span>${p.dateEnded}</div>`:''}
      ${p.timeToStitch?`<div><span style="color:var(--text3)">Time: </span>${esc(p.timeToStitch)}</div>`:''}
    </div>
    ${p.flossColors?`<div style="margin-top:8px;font-size:12px;color:var(--text2);border-top:1px dashed var(--border);padding-top:8px"><span style="color:var(--text3)">Floss: </span>${esc(p.flossColors)}</div>`:''}
    ${p.ideas?`<div style="margin-top:6px;font-size:12px;font-style:italic;color:var(--text2);border-top:1px dashed var(--border);padding-top:6px">${esc(p.ideas)}</div>`:''}
  </div>`;

}

function saveProject(id) {
  const title = document.getElementById('pf-title').value.trim();
  if (!title) { alert('Please enter a project title.'); return; }
  const status = document.getElementById('pf-status').value;
  const proj = {
    id: id || uid(),
    title,
    pattern: document.getElementById('pf-pattern').value.trim(),
    designer: document.getElementById('pf-designer').value.trim(),
    status,
    fabric: document.getElementById('pf-fabric').value.trim(),
    fabricCount: document.getElementById('pf-fabricCount').value.trim(),
    dateStarted: document.getElementById('pf-dateStarted').value,
    dateEnded: document.getElementById('pf-dateEnded').value,
    timeToStitch: document.getElementById('pf-timeToStitch').value.trim(),
    flossColors: document.getElementById('pf-flossColors').value.trim(),
    isGift: document.getElementById('pf-isGift').checked,
    giftFor: document.getElementById('pf-giftFor')?.value.trim()||'',
    ideas: document.getElementById('pf-ideas').value.trim(),
  };
  if (id) {
    const existing = (data.projects||[]).find(p=>p.id===id);
    proj.progressPct = existing?.progressPct || 0;
    proj.progressLog = existing?.progressLog || [];
    data.projects = (data.projects||[]).map(p=>p.id===id?proj:p);
  } else {
    proj.progressPct = 0;
    proj.progressLog = [];
    data.projects = [...(data.projects||[]), proj];
  }
  save();
  closeModalDirect();
  updateStats();
  renderTab();
  // Reopen the status modal if it was open
  setTimeout(() => openStatusModal(status), 80);
}

function deleteProject(id) {
  if (!confirm('Delete this project?')) return;
  const p = (data.projects||[]).find(x=>x.id===id);
  data.projects = (data.projects||[]).filter(x=>x.id!==id);
  save(); updateStats();
  closeModalDirect();
  renderTab();
  if (p?.status) setTimeout(()=>openStatusModal(p.status),80);
}

function openProgressModal(id) {
  const p = (data.projects||[]).find(x=>x.id===id);
  if (!p) return;

  const renderProgressBody = () => {
    const curr = (data.projects||[]).find(x=>x.id===id);
    if (!curr) return;
    const pct = curr.progressPct || 0;
    const log = curr.progressLog || [];
    const totalHrs = log.reduce((s,e)=>s+(parseFloat(e.hours)||0),0);
    const bodyEl = document.getElementById('prog-body');
    if (!bodyEl) return;
    bodyEl.innerHTML = `
      <div style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <span style="font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em">Completion</span>
          <span style="font-family:var(--serif);font-size:22px;color:var(--accent);font-weight:700" id="pct-display">${pct}%</span>
        </div>
        <input type="range" min="0" max="100" value="${pct}" id="pct-range" style="width:100%;accent-color:var(--accent);height:6px;cursor:pointer;margin-bottom:6px" oninput="document.getElementById('pct-display').textContent=this.value+'%'"/>
        <div class="progress-bar"><div class="progress-fill" id="pct-bar" style="width:${pct}%"></div></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">
          ${[0,10,25,50,75,90,100].map(v=>`<button onclick="document.getElementById('pct-range').value=${v};document.getElementById('pct-display').textContent='${v}%';document.getElementById('pct-bar').style.width='${v}%'" style="padding:3px 10px;border-radius:999px;border:1.5px solid ${pct===v?'var(--accent)':'var(--border)'};background:${pct===v?'var(--accent)':'var(--surface)'};color:${pct===v?'#fff':'var(--text2)'};cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:600">${v}%</button>`).join('')}
        </div>
      </div>

      <div style="background:var(--sand);border-radius:10px;padding:14px;margin-bottom:16px">
        <div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px">Log a Stitch Session</div>
        <div style="display:grid;grid-template-columns:1fr auto;gap:8px;align-items:flex-start">
          <textarea id="log-note" class="inp" style="min-height:52px;font-size:13px" placeholder="e.g. Finished the border, started fill stitching…"></textarea>
          <div style="display:flex;flex-direction:column;gap:6px;min-width:80px">
            <input id="log-hours" class="inp" style="text-align:center;padding:6px;font-size:13px" placeholder="Hours"/>
            <button class="btn btn-primary btn-sm" onclick="addProgressLog('${id}')">+ Log</button>
          </div>
        </div>
      </div>

      ${log.length ? `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em">Session History</span>
        ${totalHrs>0?`<span style="background:var(--oat);color:var(--timber);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600">${totalHrs.toFixed(1)} hrs total</span>`:''}
      </div>
      <div style="max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:6px">
        ${log.map(e=>`<div style="background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:8px 12px;display:flex;gap:10px;align-items:flex-start">
          <div style="font-size:11px;color:var(--text3);min-width:80px;flex-shrink:0">${e.date}</div>
          ${e.hours?`<span style="background:var(--oat);color:var(--timber);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600;flex-shrink:0">${e.hours}h</span>`:''}
          <div style="font-size:12px;color:var(--text);flex:1">${esc(e.note)||'<em style="color:var(--text3)">session logged</em>'}</div>
        </div>`).join('')}
      </div>` : '<div style="text-align:center;padding:16px;font-size:13px;color:var(--text3);font-style:italic">No sessions logged yet.</div>'}

      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModalDirect()">Close</button>
        <button class="btn btn-primary" onclick="saveProgress('${id}')">Save Progress</button>
      </div>`;
  };

  openModal(`Progress — ${esc(p.title||'Project')}`, `<div id="prog-body"></div>`, true);
  renderProgressBody();
}

function addProgressLog(id) {
  const note = document.getElementById('log-note').value.trim();
  const hours = document.getElementById('log-hours').value.trim();
  if (!note && !hours) return;
  const p = (data.projects||[]).find(x=>x.id===id);
  if (!p) return;
  const entry = { id:uid(), date:new Date().toISOString().slice(0,10), hours, note };
  p.progressLog = [entry, ...(p.progressLog||[])];
  // Also update pct from the slider if it changed
  const slider = document.getElementById('pct-range');
  if (slider) p.progressPct = parseInt(slider.value)||p.progressPct||0;
  save();
  openProgressModal(id);
}

function saveProgress(id) {
  const pct = parseInt(document.getElementById('pct-range')?.value||'0');
  const p = (data.projects||[]).find(x=>x.id===id);
  if (p) { p.progressPct = pct; save(); }
  closeModalDirect();
  updateStats();
  renderTab();
  if (p?.status) setTimeout(()=>openStatusModal(p.status),80);
}

function openChartFile(id) {
  const c = (data.charts||[]).find(x=>x.id===id);

  const w = window.open('','_blank');

  } else {
    w.document.write(`<img src="${c.fileData}" style="max-width:100%;display:block;margin:auto"/>`);
  }
}

function previewChartFile() {
  const file = document.getElementById('cf-file').files[0];
  if (!file) return;
  document.getElementById('cf-file-name').textContent = file.name;
  const reader = new FileReader();
  reader.onload = e => {
    window._pendingFileData = e.target.result;
    window._pendingFileName = file.name;
    window._pendingFileType = file.type;
  };
  reader.readAsDataURL(file);
}

function saveChart(id, designerId) {
  const dSel = document.getElementById('cf-designer').value;
  const c = {
    id:id||uid(),
    designerId: dSel || designerId,
    title:document.getElementById('cf-title').value.trim(),
    status:document.getElementById('cf-status').value,
    fabric:document.getElementById('cf-fabric').value.trim(),
    size:document.getElementById('cf-size').value.trim(),
    datePurchased:document.getElementById('cf-datePurchased').value,
    purchasedFrom:(()=>{
      const sel = document.getElementById('cf-purchasedFrom').value;
      if (sel === 'Other') {
        return document.getElementById('cf-purchasedFrom-other').value.trim();
      }
      return sel;
    })(),
    notes:document.getElementById('cf-notes').value.trim(),
    season:document.getElementById('cf-season')?.value||'',
    holiday:document.getElementById('cf-holiday')?.value||'',
    holidayOther:document.getElementById('cf-holiday-other')?.value.trim()||'',
    theme:document.getElementById('cf-theme')?.value||'',
    themeOther:document.getElementById('cf-theme-other')?.value.trim()||'',
  };
  if (!c.title) { alert('Please enter a chart title.'); return; }
  // Handle file
  const existing = id ? (data.charts||[]).find(x=>x.id===id) : null;
  if (window._pendingFileData) {
    c.fileData = window._pendingFileData;
    c.fileName = window._pendingFileName;
    c.fileType = window._pendingFileType;
  } else if (window._clearChartFile) {
    c.fileData = null; c.fileName = null; c.fileType = null;
  } else if (existing) {
    c.fileData = existing.fileData; c.fileName = existing.fileName; c.fileType = existing.fileType;
  }
  if (id) data.charts = (data.charts||[]).map(x=>x.id===id?c:x);
  else data.charts = [...(data.charts||[]), c];
  save();
  closeModalDirect();
  renderTab();
  // If a designer inventory modal was open, reopen it
  const dId = c.designerId;
  if (dId) {
    setTimeout(() => openDesignerInventory(dId), 80);
  }
}

function renderFabric() {
  const counts = data.fabricCounts || [];
  const fabrics = data.fabrics || [];
  const el = document.getElementById('tabContent');

  let html = `<div class="page-hdr">
    <div><div class="page-hdr-title">Fabric Stash</div><div class="page-hdr-sub">${counts.length} count${counts.length!==1?'s':''} · ${fabrics.length} piece${fabrics.length!==1?'s':''}</div></div>
    <div class="page-hdr-actions"><button class="btn btn-primary" onclick="openFabricCountForm()">+ Add Fabric Count</button></div>
  </div>`;

  if (!counts.length) {
    html += `<div class="empty"><div class="empty-icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18"/></svg></div><div class="empty-title">No fabric counts yet</div><div class="empty-sub">Add a stitch count (e.g. 28ct) to start organising your fabric stash.</div></div>`;
  } else {
    html += `<div class="tile-grid">`;
    counts.forEach((ct, i) => {
      const col = FABRIC_TILE_COLORS[i % FABRIC_TILE_COLORS.length];
      const pieces = fabrics.filter(f => f.countId === ct.id);
      html += `<div class="tile" onclick="openFabricInventory('${ct.id}')">
        <div class="tile-accent-bar" style="background:${col.bar}"></div>
        <div class="tile-body">
          <div style="display:flex;align-items:baseline;gap:3px;margin-bottom:2px">
            <span style="font-family:var(--serif);font-size:26px;font-weight:600;color:var(--text);line-height:1">${esc(ct.count)}</span>
            <span style="font-size:12px;font-weight:500;color:var(--text3)">ct</span>
          </div>
          <div class="tile-sub">${ct.notes?esc(ct.notes):'Fabric count'}</div>
          <div class="tile-footer">
            <span class="tile-count">${pieces.length} piece${pieces.length!==1?'s':''}</span>
            <button class="btn-icon del" onclick="event.stopPropagation();deleteFabricCount('${ct.id}')" title="Delete">${ICONS.trash}</button>
          </div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  el.innerHTML = html;
}

function exportShoppingEmail() {
  const list = (data.shoppingList||[]).filter(x=>!x.bought);
  if (!list.length) { alert('No items to email.'); return; }

  const groups = {};
  list.forEach(x => {
    const store = x.placeToBuy || 'No Store Listed';
    if (!groups[store]) groups[store] = [];
    groups[store].push(x);
  });
  Object.values(groups).forEach(g => g.sort((a,b)=>(a.item||'').localeCompare(b.item||'')));

  const date = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  let body = `StitchKeeper Shopping List — ${date}\n`;
  body += `${'='.repeat(40)}\n\n`;

  Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([store, items]) => {
    body += `${store.toUpperCase()}\n${'-'.repeat(store.length)}\n`;
    items.forEach(x => {
      body += `☐  ${x.item||''}`;
      if (x.quantity && x.quantity !== '1') body += ` (qty: ${x.quantity})`;
      if (x.category) body += `  [${x.category}]`;
      if (x.notes) body += `  — ${x.notes}`;
      body += '\n';
    });
    body += '\n';
  });
  body += `\nGenerated by StitchKeeper`;

  const subject = encodeURIComponent(`Shopping List — ${date}`);
  const bodyEncoded = encodeURIComponent(body);
  window.location.href = `mailto:?subject=${subject}&body=${bodyEncoded}`;
}

function saveShop(id) {
  const sfPlaceSel = document.getElementById('sf-place').value;
  const sfPlaceFinal = sfPlaceSel === 'Other' ? (document.getElementById('sf-place-other').value.trim()||'Other') : sfPlaceSel;
  const x = { id:id||uid(), item:document.getElementById('sf-item').value.trim(), category:document.getElementById('sf-cat').value, quantity:document.getElementById('sf-qty').value.trim(), placeToBuy:sfPlaceFinal, notes:document.getElementById('sf-notes').value.trim(), bought:false };
  if (!x.item) { alert('Please enter an item.'); return; }
  if (id) data.shoppingList = (data.shoppingList||[]).map(s=>s.id===id?{...x,bought:(data.shoppingList||[]).find(s=>s.id===id)?.bought||false}:s);
  else data.shoppingList = [...(data.shoppingList||[]), x];
  save(); closeModalDirect(); renderTab();
}

// ===== CONVERSION CHARTS =====
function renderConversion() {
  const el = document.getElementById('tabContent');
  const CONV_TABS = [
    {id:'ccw-dmc',label:'CCW → DMC',data:CCW_TO_DMC,col1:'CCW Color',col2:'DMC #',col3:'DMC Name'},
    {id:'wdw-dmc',label:'WDW → DMC',data:WDW_TO_DMC,col1:'WDW Color',col2:'DMC #',col3:'DMC Name'},
    {id:'gast-dmc',label:'GAST → DMC',data:GAST_TO_DMC,col1:'GAST Color',col2:'DMC #',col3:'DMC Name'},
    {id:'aurifil-dmc',label:'Aurifil → DMC',data:AURIFIL_TO_DMC,col1:'Aurifil #',col2:'DMC #',col3:''},
    {id:'wdw-ccw',label:'WDW → CCW',data:WDW_TO_CCW,col1:'WDW Color',col2:'CCW Color',col3:''},
  ];
  let activeConv = window._activeConv || 'ccw-dmc';
  window._activeConv = activeConv;
  const active = CONV_TABS.find(t=>t.id===activeConv) || CONV_TABS[0];

  let tableRows = active.data.filter(row => {
    const q = (window._convSearch||'').toLowerCase();
    if (!q) return true;
    return row.some(v => v.toLowerCase().includes(q));
  });

  let html = `<div class="section-hdr"><h2>Conversion Charts</h2></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px">
    ${CONV_TABS.map(t=>`<button onclick="window._activeConv='${t.id}';window._convSearch='';renderConversion();" style="padding:8px 16px;border-radius:8px;border:2px solid ${activeConv===t.id?'var(--accent)':'var(--border)'};background:${activeConv===t.id?'var(--accent)':'var(--surface)'};color:${activeConv===t.id?'#fff':'var(--text2)'};cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:600">${t.label}</button>`).join('')}
  </div>
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap">
    <div class="search-wrap" style="max-width:300px">
      <span class="search-icon">${ICONS.search}</span>
      <input class="inp" style="padding-left:32px" placeholder="Search colors..." value="${esc(window._convSearch||'')}" oninput="window._convSearch=this.value;renderConversion()"/>
    </div>
    <span style="font-size:12px;color:var(--text3)">${tableRows.length} match${tableRows.length!==1?'es':''} of ${active.data.length}</span>
  </div>
  <div style="overflow-x:auto"><div class="table-wrap">
    <table class="conv-table">
      <thead><tr><th>${active.col1}</th><th>${active.col2}</th>${active.col3?`<th>${active.col3}</th>`:''}</tr></thead>
      <tbody>
        ${tableRows.length ? tableRows.map(row=>`<tr><td style="font-weight:600">${esc(row[0])}</td><td>${esc(row[1])}</td>${active.col3?`<td style="color:var(--text2)">${esc(row[2]||'')}</td>`:''}</tr>`).join('') : '<tr><td colspan="3" style="text-align:center;padding:30px;color:var(--text3);font-style:italic">No matches found.</td></tr>'}
      </tbody>
    </table>
  </div></div>`;

  el.innerHTML = html;
}

// ===== CALCULATOR =====
function renderCalculator() {
  const el = document.getElementById('tabContent');
  el.innerHTML = `
  <div class="section-hdr"><h2>Fabric Calculator</h2></div>
  <div class="card" style="max-width:680px;margin:0 auto">
    <div class="calc-step">
      <div class="calc-step-title"><span class="step-badge">1</span> Design Size (in stitches)</div>
      <div style="display:flex;gap:16px;flex-wrap:wrap">
        <div class="field" style="flex:1;min-width:120px"><label>Width (stitches)</label><input class="inp" id="calc-w" type="text" inputmode="decimal" placeholder="e.g. 200"/></div>
        <div class="field" style="flex:1;min-width:120px"><label>Height (stitches)</label><input class="inp" id="calc-h" type="text" inputmode="decimal" placeholder="e.g. 300"/></div>
      </div>
    </div>
    <div class="calc-step">
      <div class="calc-step-title"><span class="step-badge">2</span> Fabric Count</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
        ${["10","14","16","18","20","22","25","28","32","36","40"].map(c=>`<button onclick="selectCount('${c}')" id="ct-${c}" class="brand-pill" style="font-size:12px;padding:4px 10px">${c}ct</button>`).join('')}
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <input class="inp" id="calc-ct-custom" placeholder="Or type custom count..." style="max-width:200px" oninput="document.querySelectorAll('.brand-pill').forEach(b=>b.classList.remove('sel'))"/>
      </div>
    </div>
    <div class="calc-step">
      <div class="calc-step-title"><span class="step-badge">3</span> Stitch Type</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <div class="type-opt sel" id="opt-over1" onclick="selectStitchType('over1')">
          <div style="font-weight:700;color:var(--accent)">Over 1</div>
          <div style="font-size:12px;color:var(--text3)">Aida — 10, 14, 16, 18, 20ct</div>
        </div>
        <div class="type-opt" id="opt-over2" onclick="selectStitchType('over2')">
          <div style="font-weight:700">Over 2</div>
          <div style="font-size:12px;color:var(--text3)">Linen & evenweave — 22ct+</div>
        </div>
      </div>
      <div id="over2-note" style="display:none;margin-top:10px;font-size:12px;color:var(--accent);background:var(--sand);padding:8px 12px;border-radius:8px">
        💡 Over two halves the effective count — e.g. 28ct ÷ 2 = <strong>14 stitches per inch</strong>
      </div>
    </div>
    <div class="calc-step">
      <div class="calc-step-title"><span class="step-badge">4</span> Border / Margin</div>
      <div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap">
        <div class="field" style="flex:0 0 200px"><label>Border on each side (inches)</label><input class="inp" id="calc-border" type="text" inputmode="decimal" value="3" placeholder="e.g. 3"/></div>
        <div style="padding-top:28px;font-size:12px;color:var(--text3);font-style:italic">💡 Most stitchers allow 3–4 inches each side for framing.</div>
      </div>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="resetCalc()">↺ Reset</button>
      <button class="btn btn-primary" onclick="runCalc()">📐 Calculate</button>
    </div>
    <div id="calc-result"></div>
  </div>`;
  window._stitchType = 'over1';
}

function selectCount(c) {
  document.querySelectorAll('[id^="ct-"]').forEach(b => b.classList.remove('sel'));
  document.getElementById('ct-'+c)?.classList.add('sel');
  document.getElementById('calc-ct-custom').value = '';
  window._selectedCount = c;
  const isAida = ['10','14','16','18','20'].includes(c);
  selectStitchType(isAida ? 'over1' : 'over2');
}

function selectStitchType(type) {
  window._stitchType = type;
  document.getElementById('opt-over1').className = 'type-opt' + (type==='over1'?' sel':'');
  document.getElementById('opt-over2').className = 'type-opt' + (type==='over2'?' sel':'');
  document.getElementById('over2-note').style.display = type==='over2' ? '' : 'none';
}

function resetCalc() {
  document.getElementById('calc-w').value = '';
  document.getElementById('calc-h').value = '';
  document.getElementById('calc-border').value = '3';
  document.getElementById('calc-ct-custom').value = '';
  document.querySelectorAll('[id^="ct-"]').forEach(b => b.classList.remove('sel'));
  document.getElementById('calc-result').innerHTML = '';
  window._selectedCount = '';
  selectStitchType('over1');
}

function toFrac(val) {
  const whole = Math.floor(val), dec = val - whole;
  const eighths = Math.round(dec * 8);
  if (eighths === 0) return `${whole}"`;
  if (eighths === 8) return `${whole+1}"`;
  const f = {1:"⅛",2:"¼",3:"⅜",4:"½",5:"⅝",6:"¾",7:"⅞"};
  return whole > 0 ? `${whole} ${f[eighths]}"` : `${f[eighths]}"`;
}

function runCalc() {
  const w = parseFloat(document.getElementById('calc-w').value);
  const h = parseFloat(document.getElementById('calc-h').value);
  const customCt = document.getElementById('calc-ct-custom').value.trim();
  const rawCt = customCt ? parseFloat(customCt) : parseFloat(window._selectedCount||'');
  const border = parseFloat(document.getElementById('calc-border').value)||0;
  const type = window._stitchType || 'over1';
  if (!w || !h || !rawCt) { alert('Please fill in Width, Height, and select a fabric count.'); return; }
  const effCt = type === 'over2' ? rawCt/2 : rawCt;
  const dw = w/effCt, dh = h/effCt;
  const tw = dw + border*2, th = dh + border*2;
  document.getElementById('calc-result').innerHTML = `
    <div class="calc-result">
      <div style="font-family:var(--serif);font-size:16px;color:var(--text2);margin-bottom:14px">📐 Your Results</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
        <div class="result-box">
          <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px">Design Area Only</div>
          <div class="result-big">${toFrac(dw)} × ${toFrac(dh)}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:3px">${(dw*2.54).toFixed(1)} × ${(dh*2.54).toFixed(1)} cm</div>
        </div>
        <div class="result-box-dark">
          <div style="font-size:10px;color:#dcc8f0;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px">✂️ Cut Size (with ${border}" border)</div>
          <div class="result-big" style="color:#fff">${toFrac(tw)} × ${toFrac(th)}</div>
          <div style="font-size:11px;color:#dcc8f0;margin-top:3px">${(tw*2.54).toFixed(1)} × ${(th*2.54).toFixed(1)} cm</div>
        </div>
      </div>
      <div style="background:rgba(255,255,255,0.65);border-radius:8px;padding:12px 14px;font-size:12px;color:var(--text2);line-height:1.9">
        <strong style="color:var(--text2)">How it was calculated (${type==='over2'?'over two':'over one'}):</strong><br>
        ${type==='over2'?`Effective count: ${rawCt}ct ÷ 2 = <strong>${effCt} stitches/inch</strong><br>`:`Effective count: <strong>${rawCt} stitches/inch</strong><br>`}
        ${w} ÷ ${effCt} = <strong>${toFrac(dw)}</strong> wide &nbsp;·&nbsp; ${h} ÷ ${effCt} = <strong>${toFrac(dh)}</strong> tall<br>
        Cut size: add ${border}" each side → <strong>${toFrac(tw)} × ${toFrac(th)}</strong>
      </div>
      <div style="margin-top:8px;font-size:11px;color:var(--text3);font-style:italic">Results rounded to nearest ⅛" — always add a little extra if in doubt!</div>
    </div>`;
}

// ===== HELPERS =====
function deleteItem(collection, id) {
  if (!confirm('Delete this item?')) return;
  data[collection] = (data[collection]||[]).filter(x=>x.id!==id);
  save(); renderTab();
}

// ===== INIT =====
updateStats();
renderTab();
</script>
</body>
</html>
